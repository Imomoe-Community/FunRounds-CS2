"help.body" = "fr_info / !info / !frinfo — 查看当前模式\nfr_help / !help / !frhelp — 查看帮助\nfr_knock [0|1|2] / !knock [0|1|2] — 开枪击退：0关闭／1地面及空中／2仅空中（默认）；无参数依次切换\nfr_c4 / !c4 — T队在允许普通购买时，按配置现金价格购买C4\nfr_suicide / !suicide — 允许自爆时，使用已有C4或购买后自爆\nfr_chicken / !chicken — 购买一只普通鸡，使用配置现金价格\nfr_healthshot / !healthshot — 购买一支医疗针，使用配置现金价格\nfr_nvg / !nvg — 切换夜视仪\nfr_wire <blue|yellow|red|green> / !wire <color> — 选安包剪线或当前拆弹剪线；不选则不使用此机制"

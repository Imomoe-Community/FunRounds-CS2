"help.body" = "fr_info / !info / !frinfo — Show the current mode\nfr_help / !help / !frhelp — Show help\nfr_knock [0|1|2] / !knock [0|1|2] — Self-push: 0 off, 1 ground and air, 2 airborne only (default); omit the value to cycle\nfr_c4 / !c4 — T players can buy C4 at the configured cash price when ordinary purchases are allowed\nfr_suicide / !suicide — Start a suicide blast with owned or newly purchased C4 when enabled\nfr_chicken / !chicken — Buy one ordinary chicken at the configured cash price\nfr_healthshot / !healthshot — Buy one healthshot at the configured cash price\nfr_nvg / !nvg — Toggle night vision\nfr_wire <blue|yellow|red|green> / !wire <color> — Choose a plant or defuse wire; otherwise keep the mode's normal timer"
